---
# ArgoCD Application with Sealed Secrets
# This example uses Bitnami Sealed Secrets for GitOps-safe secret management

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gavin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/restanrm/gavin
    targetRevision: main
    path: charts/gavin
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.repository
          value: "your-registry.io/gavin"
        - name: image.tag
          value: "0.1.0"
        - name: existingSecret
          value: "gavin-secrets"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: gavin
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Sealed Secret - safe to commit to Git
# Generated with: kubeseal -o yaml < secret.yaml > sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gavin-secrets
  namespace: gavin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Sync before main app
spec:
  encryptedData:
    # These are encrypted values - replace with your own
    # Generate by running:
    # echo -n "your-value" | kubeseal --raw --scope strict --namespace gavin --name gavin-secrets --from-file=/dev/stdin
    OIDC_ISSUER_URL: AgBX... # encrypted value
    OIDC_CLIENT_ID: AgCY...   # encrypted value
    OIDC_CLIENT_SECRET: AgDZ... # encrypted value
    OIDC_REDIRECT_URL: AgEA...  # encrypted value
    SESSION_SECRET: AgFB...     # encrypted value
  template:
    metadata:
      name: gavin-secrets
      namespace: gavin
    type: Opaque

---
# How to create your sealed secret:
# 
# 1. Install kubeseal CLI:
#    wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/kubeseal-0.24.0-linux-amd64.tar.gz
#    tar xfz kubeseal-0.24.0-linux-amd64.tar.gz
#    sudo install -m 755 kubeseal /usr/local/bin/kubeseal
#
# 2. Create regular secret:
#    kubectl create secret generic gavin-secrets \
#      --namespace gavin \
#      --from-literal=OIDC_ISSUER_URL=https://your-oidc.com \
#      --from-literal=OIDC_CLIENT_ID=your-client-id \
#      --from-literal=OIDC_CLIENT_SECRET=your-secret \
#      --from-literal=OIDC_REDIRECT_URL=https://gavin.restanrm.fr/api/auth/callback \
#      --from-literal=SESSION_SECRET=$(openssl rand -hex 32) \
#      --dry-run=client -o yaml > secret.yaml
#
# 3. Seal the secret:
#    kubeseal -o yaml < secret.yaml > sealed-secret.yaml
#
# 4. Delete the original secret file:
#    rm secret.yaml
#
# 5. Commit sealed-secret.yaml to git (it's safe!)
#    git add examples/argocd/sealed-secret.yaml
