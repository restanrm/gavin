---
# ArgoCD Application with External Secrets Operator
# This example shows how to use External Secrets Operator
# to sync secrets from external providers (AWS Secrets Manager, Vault, etc.)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gavin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/restanrm/gavin
    targetRevision: main
    path: charts/gavin
    helm:
      valueFiles:
        - values-prod.yaml
      parameters:
        - name: image.repository
          value: "your-registry.io/gavin"
        - name: image.tag
          value: "0.1.0"
        # Reference the external secret
        - name: existingSecret
          value: "gavin-secrets"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: gavin
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    
    # Sync waves for proper ordering
    syncOptions:
      - CreateNamespace=true
    
  # Additional sync wave for external secret
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status

---
# External Secret that syncs from AWS Secrets Manager
# Deploy this separately or include in the Helm chart
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gavin-secrets
  namespace: gavin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # Sync before main app
spec:
  refreshInterval: 1h
  
  # Secret store reference
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  
  # Target secret
  target:
    name: gavin-secrets
    creationPolicy: Owner
  
  # Data to sync from external provider
  data:
    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: gavin/oidc
        property: issuer_url
    
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: gavin/oidc
        property: client_id
    
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: gavin/oidc
        property: client_secret
    
    - secretKey: OIDC_REDIRECT_URL
      remoteRef:
        key: gavin/oidc
        property: redirect_url
    
    - secretKey: SESSION_SECRET
      remoteRef:
        key: gavin/session
        property: secret

---
# Secret Store for AWS Secrets Manager
# Configure once per cluster/namespace
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: gavin
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Use IRSA for authentication
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
