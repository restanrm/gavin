{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gavin.fullname" . }}
  labels:
    {{- include "gavin.labels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_ISSUER_URL: {{ .Values.secrets.oidcIssuerUrl | quote }}
  OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  OIDC_REDIRECT_URL: {{ default (printf "https://%s/api/auth/callback" .Values.domain) .Values.secrets.oidcRedirectUrl | quote }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
{{- end }}
