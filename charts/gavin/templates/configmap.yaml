apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gavin.fullname" . }}
  labels:
    {{- include "gavin.labels" . | nindent 4 }}
data:
  HOST: {{ .Values.config.host | quote }}
  PORT: {{ .Values.config.port | quote }}
  FRONTEND_DIR: {{ .Values.config.frontendDir | quote }}
  UPLOAD_DIR: {{ .Values.config.uploadDir | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  PUBLIC_DOMAIN: {{ default .Values.domain .Values.config.publicDomain | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  ALBUM_METADATA_ENABLED: {{ .Values.config.albumMetadataEnabled | quote }}
  {{- with .Values.config.albumMetadataUserAgent }}
  ALBUM_METADATA_USER_AGENT: {{ . | quote }}
  {{- end }}
  ALBUM_COVER_RECOGNITION_PROVIDER: {{ .Values.config.albumCoverRecognitionProvider | quote }}
  GEMINI_BASE_URL: {{ .Values.config.geminiBaseUrl | quote }}
  GEMINI_ALBUM_COVER_MODEL: {{ .Values.config.geminiAlbumCoverModel | quote }}
  OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  OPENAI_ALBUM_COVER_MODEL: {{ .Values.config.openaiAlbumCoverModel | quote }}
  MUSICBRAINZ_BASE_URL: {{ .Values.config.musicbrainzBaseUrl | quote }}
  COVER_ART_ARCHIVE_BASE_URL: {{ .Values.config.coverArtArchiveBaseUrl | quote }}
