# Default values for gavin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Public domain used by ingress defaults and generated callback URL examples.
# Override this in tests/staging, e.g. --set domain=gavin.test.example
# Production default requested for this app.
domain: gavin.restanrm.fr

image:
  repository: ghcr.io/restanrm/gavin
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: "" # empty uses .Values.domain
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: gavin-tls
  #    hosts:
  #      - gavin.restanrm.fr

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Autoscaling configuration (disabled by default for MVP)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Persistent storage for database and uploads
persistence:
  enabled: true
  # Use existingClaim to reference a pre-created PVC
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  # Mount path for data directory
  mountPath: /app/data
  annotations: {}

# Application configuration (non-sensitive)
config:
  # These are set via environment variables in the container
  host: "0.0.0.0"
  port: 3000
  frontendDir: "/app/dist"
  uploadDir: "/app/data/uploads"
  databaseUrl: "sqlite:///app/data/gavin.db"
  # Leave empty to use .Values.domain.
  publicDomain: ""
  rustLog: "info,gavin=info"
  cookieSecure: "true"
  authMode: "oidc"
  albumMetadataEnabled: "true"
  # Optional; set to identify your deployment to MusicBrainz.
  albumMetadataUserAgent: ""
  # Album-cover visual recognition provider: gemini, openai, or disabled.
  albumCoverRecognitionProvider: "gemini"
  geminiBaseUrl: "https://generativelanguage.googleapis.com"
  geminiAlbumCoverModel: "gemini-2.0-flash"
  openaiBaseUrl: "https://api.openai.com"
  openaiAlbumCoverModel: "gpt-4o-mini"
  musicbrainzBaseUrl: "https://musicbrainz.org"
  coverArtArchiveBaseUrl: "https://coverartarchive.org"

# OIDC and Session secrets configuration
# Option 1: Use an existing secret (recommended for production)
# Create secret manually or via external-secrets/sealed-secrets
existingSecret: ""

# Option 2: Create secret from values (not recommended for production)
# Set existingSecret to "" to use these values
secrets:
  # OIDC Configuration
  oidcIssuerUrl: ""
  oidcClientId: ""
  oidcClientSecret: ""
  # Defaults to https://<domain>/api/auth/callback when left empty.
  oidcRedirectUrl: ""
  # Session secret (minimum 64 characters)
  sessionSecret: ""
  # Required when albumCoverRecognitionProvider is gemini.
  geminiApiKey: ""
  # Required when albumCoverRecognitionProvider is openai.
  openaiApiKey: ""

# Additional volumes to mount
extraVolumes: []
extraVolumeMounts: []

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment
tolerations: []

# Affinity for pod assignment
affinity: {}

# Pod disruption budget (recommended for multi-replica deployments)
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Network policy (if needed)
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
